services:
  - type: web
    name: yt-services-bot
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: NOTIFY_BOT_TOKEN
        sync: false
      - key: NOTIFY_ADMIN_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SERVER_PORT
        sync: false
      - key: SMM_API_URL
        sync: false
      - key: SMM_API_KEY
        sync: false
      - key: SMM_SERVICE_ID_YT_SUBS
        sync: false
      - key: SMM_SERVICE_ID_YT_VIEWS
        sync: false
      - key: SMM_SERVICE_ID_YT_LIKES
        sync: false
