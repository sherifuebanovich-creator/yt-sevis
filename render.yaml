services:
  - type: web
    name: yt-services-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /ping
    autoDeployTrigger: commit
    envVars:
      # Актуальная папка node_modules на Render собирается заново,
      # локальный dist/ в git не попадает
      - key: NODE_VERSION
        value: "22"
      # Neon, не Render Postgres: бесплатная база Render удаляется через
      # 30 дней. Строку ставим вручную в Render Dashboard, в git её нет.
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: NOTIFY_BOT_TOKEN
        sync: false
      - key: NOTIFY_ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SMM_API_URL
        sync: false
      - key: SMM_API_KEY
        sync: false
      - key: SMM_SERVICE_ID_YT_SUBS
        sync: false
      - key: SMM_SERVICE_ID_YT_VIEWS
        sync: false
      - key: SMM_SERVICE_ID_YT_LIKES
        sync: false
