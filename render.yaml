databases:
  - name: ytbot-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"

services:
  - type: web
    name: yt-services-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /ping
    autoDeployTrigger: commit
    envVars:
      # Актуальная папка node_modules на Render собирается заново,
      # локальный dist/ в git не попадает
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ytbot-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: NOTIFY_BOT_TOKEN
        sync: false
      - key: NOTIFY_ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SMM_API_URL
        sync: false
      - key: SMM_API_KEY
        sync: false
      - key: SMM_SERVICE_ID_YT_SUBS
        sync: false
      - key: SMM_SERVICE_ID_YT_VIEWS
        sync: false
      - key: SMM_SERVICE_ID_YT_LIKES
        sync: false
